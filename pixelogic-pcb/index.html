<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Pixelogic PCB - Pixel Logic Simulator</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pixelogic">
    <link rel="apple-touch-icon" href="icon-192.png">
    <!-- The tab icon is its own render, not the launcher icon scaled down:
         at 16px the traces and the leads turn to mush, so the favicon is the
         package on its own. See scripts/generate-icons.js. -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">

    <link rel="stylesheet" href="pixelogic-pcb.css">
</head>

<body>
    <div id="app">
        <!-- One fixed-height row that never wraps: run controls on the left,
             view controls and the overflow menu on the right. -->
        <div id="topbar">
            <div class="bar-group">
                <button id="playPauseBtn" class="icon-btn" title="Play/Pause (P)" aria-pressed="false">&#x25B6;</button>
                <button id="stepBtn" class="icon-btn" title="Step (Space)">&#x23ED;</button>
            </div>

            <div class="bar-spacer"></div>

            <div class="bar-group">
                <button id="undoBtn" class="icon-btn" title="Undo (Ctrl+Z)" disabled>&#x21B6;</button>
                <button id="redoBtn" class="icon-btn" title="Redo (Ctrl+Shift+Z)" disabled>&#x21B7;</button>
            </div>

            <div class="bar-group zoom-group">
                <button id="zoomOutBtn" class="icon-btn" title="Zoom out (-)">&minus;</button>
                <span id="zoomValue" class="zoom-value"
                    title="Scroll or arrow keys pan; Ctrl+scroll (or pinch) zooms at the cursor; Shift-drag or middle-drag also pans">100%</span>
                <button id="zoomInBtn" class="icon-btn" title="Zoom in (+)">+</button>
            </div>

            <button id="menuBtn" class="icon-btn" title="More" aria-haspopup="menu"
                aria-expanded="false">&#x22EF;</button>
        </div>

        <!-- Tools sit beside the canvas on wide screens and below it on narrow
             ones, so the canvas keeps whichever dimension is scarce. -->
        <div id="workspace">
            <div id="toolrail" role="toolbar" aria-label="Tools">
                <div class="tool-group" aria-label="Materials">
                    <button class="tool-btn swatch-tool" data-tool="conductor" data-key="1"
                        title="Conductor (1) — right-drag always erases" style="--swatch:#3fae4a">Conductor</button>
                    <button class="tool-btn swatch-tool" data-tool="insulator" data-key="2"
                        title="Erase / Insulator (2)" style="--swatch:#0d3b0d">Erase</button>
                    <button class="tool-btn swatch-tool" data-tool="gray" data-key="3"
                        title="MUX (3) — draw a solid 3x2 of it and you have a mux: a blank package until you wire it. The middle of a long side is always COM; the end of one is a pin. A wire on a corner of the COM row is SELECT and commissions it: the far row's ends are the pins, and that end is NO. Everything else is package, so wires can run alongside. Any other shape of it is a &minus;V pad"
                        style="--swatch:#2b2b2b">MUX</button>
                    <button class="tool-btn swatch-tool" data-tool="pos" data-key="4" title="+V source (4)"
                        style="--swatch:#ffffff">+V</button>
                    <button class="tool-btn swatch-tool" data-tool="neg" data-key="5" title="&minus;V source (5)"
                        style="--swatch:#000000">&minus;V</button>
                    <button class="tool-btn swatch-tool" data-tool="led" data-key="6" title="LED output (6)"
                        style="--swatch:#ff2a2a">LED</button>
                    <button class="tool-btn swatch-tool" data-tool="toggle" data-key="7" title="Toggle switch input (7)"
                        style="--swatch:#565b60">Toggle</button>
                    <button class="tool-btn swatch-tool" data-tool="switch" data-key="8"
                        title="Momentary switch input (8)" style="--swatch:#9aa0a6">Switch</button>
                </div>

                <div class="tool-group" aria-label="Modes">
                    <button class="tool-btn glyph-tool" data-tool="interact" data-key="I" data-glyph="I"
                        title="Interact (I) — runs the simulation. Hold a momentary switch or click a toggle; drag to pan the view">Interact</button>
                    <button class="tool-btn glyph-tool" data-tool="select" data-key="S" data-glyph="S"
                        title="Select (S) — drag a rectangle">Select</button>
                    <button class="tool-btn glyph-tool" data-tool="rearrange" data-key="A" data-glyph="A"
                        title="Rearrange (A) — drag a mux, a straight wire segment, a pad, or a source; connections re-route to follow. Drag from empty space to rubber-band several, Ctrl/Cmd-click (or press and hold on touch) to add/remove one, then drag any of them to move the group. R rotates, Esc deselects">Rearrange</button>
                    <button class="tool-btn glyph-tool" data-tool="paste" data-key="V" data-glyph="V" id="pasteBtn"
                        title="Paste (V) — stamps the clipboard immediately; drag it into place, then tap elsewhere or pick another tool to drop it"
                        disabled>Paste</button>
                </div>
            </div>

            <div id="viewport">
                <canvas id="grid"></canvas>

                <!-- Canvas overlays: these float over the drawing instead of
                     each taking a permanent slice of the chrome. -->
                <div id="cellInfo" class="cell-info"></div>
                <div id="saveStatus" class="save-status"></div>

                <!-- The active level's brief and its Verify button. An
                     overlay, like everything else here, so entering a level
                     never resizes the canvas out from under a drag. Hidden
                     entirely in the sandbox. -->
                <div id="levelBar" class="level-bar">
                    <div class="level-bar-main">
                        <button id="levelCollapseBtn" class="icon-btn collapse-btn"
                            title="Minimize the level text (H)" aria-expanded="true">&#x25BE;</button>
                        <div class="level-bar-text">
                            <span id="levelTitle" class="level-title"></span>
                            <span id="levelBrief" class="level-brief"></span>
                        </div>
                        <div class="level-bar-actions">
                            <button id="hintBtn" class="tool-btn" title="Show a hint"
                                aria-pressed="false">Hint</button>
                            <button id="verifyBtn" class="tool-btn primary"
                                title="Run this level's test vectors against your circuit">Verify</button>
                            <button id="levelsBtn" class="tool-btn" title="Back to the level list">Levels</button>
                        </div>
                    </div>
                    <!-- Everything below the title row is what collapsing hides. -->
                    <div id="levelDetail" class="level-detail">
                        <ol id="levelSteps" class="level-steps"></ol>
                        <div id="levelHint" class="level-hint"></div>
                    </div>
                    <div id="levelResult" class="level-result"></div>
                </div>

                <!-- Only appears while there is something to act on, so five
                     permanently-greyed buttons no longer sit in the toolbar. -->
                <div id="selectionActions" class="selection-actions" role="toolbar" aria-label="Selection actions">
                    <button id="copyBtn" class="tool-btn" title="Copy selection (Ctrl+C)" disabled>Copy</button>
                    <button id="cutBtn" class="tool-btn" title="Cut selection (Ctrl+X)" disabled>Cut</button>
                    <button id="rotateBtn" class="tool-btn" title="Rotate selection 90&deg; clockwise (R)"
                        disabled>Rotate</button>
                    <button id="mirrorBtn" class="tool-btn" title="Mirror selection left-right (M)"
                        disabled>Mirror</button>
                    <button id="saveComponentBtn" class="tool-btn"
                        title="Save the current clipboard as a named, reusable component" disabled>Save&hellip;</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ---- Overflow menu ---- -->
    <div id="menuBackdrop" class="modal-backdrop"></div>
    <div id="menuPanel" class="menu-panel" role="menu" aria-label="More">
        <div class="menu-slider">
            <label for="intervalSlider">Speed</label>
            <input id="intervalSlider" type="range" min="0" max="1000" value="773" aria-label="Simulation speed">
            <span id="intervalValue" class="menu-hint"></span>
        </div>
        <div class="menu-sep"></div>
        <button id="fitBtn" class="menu-item" role="menuitem">Fit to window<span class="menu-hint">F</span></button>
        <button id="gridToggleBtn" class="menu-item" role="menuitem" aria-pressed="true"
            title="Remembered separately for build vs. Interact">Grid lines<span class="menu-hint">G</span></button>
        <div class="menu-sep"></div>
        <button id="campaignBtn" class="menu-item" role="menuitem">Campaign&hellip;<span class="menu-hint">levels</span></button>
        <button id="sandboxToggleBtn" class="menu-item" role="menuitem">Sandbox<span class="menu-hint">free
                board</span></button>
        <button id="componentsBtn" class="menu-item" role="menuitem">Components&hellip;</button>
        <div class="menu-sep"></div>
        <button id="exportBtn" class="menu-item" role="menuitem">Export circuit<span class="menu-hint">to
                clipboard</span></button>
        <button id="importBtn" class="menu-item" role="menuitem">Import circuit<span class="menu-hint">from
                text</span></button>
        <div class="menu-sep"></div>
        <button id="resetChargesBtn" class="menu-item" role="menuitem">Reset charges<span class="menu-hint">keep
                layout</span></button>
        <button id="clearBtn" class="menu-item danger" role="menuitem">Clear grid<span
                class="menu-hint">Del</span></button>
        <div class="menu-sep"></div>
        <button id="fullscreenBtn" class="menu-item" role="menuitem" aria-pressed="false">Fullscreen</button>
    </div>

    <!-- ---- Components panel ---- -->
    <div id="componentsBackdrop" class="modal-backdrop"></div>
    <div id="componentsPanel" class="modal-panel" role="dialog" aria-label="Components">
        <div class="modal-panel-header">
            <span>Components</span>
            <button id="componentsCloseBtn" class="icon-btn" title="Close">&times;</button>
        </div>
        <div id="componentsList" class="components-list"></div>
        <div id="componentsEmpty" class="components-empty">No saved components yet. Select something, Copy it, then
            Save&hellip;</div>
    </div>

    <!-- ---- Campaign level browser ---- -->
    <div id="levelsBackdrop" class="modal-backdrop"></div>
    <div id="levelsPanel" class="modal-panel wide-panel" role="dialog" aria-label="Campaign">
        <div class="modal-panel-header">
            <span>Campaign</span>
            <button id="levelsCloseBtn" class="icon-btn" title="Close">&times;</button>
        </div>
        <p class="panel-intro">
            One part builds everything: a mux, wired as a relay. Start with a single inverter and work up
            &mdash; each level you solve is saved as a component you can paste into the next.
        </p>
        <div id="levelsList" class="levels-list"></div>
        <div class="modal-panel-footer">
            <button id="sandboxBtn" class="tool-btn">Open the sandbox</button>
            <button id="resetProgressBtn" class="tool-btn danger">Reset progress</button>
        </div>
    </div>

    <script src="model.js"></script>
    <script src="view.js"></script>
    <script src="game.js"></script>
    <script src="ui.js"></script>
    <script src="pwa.js"></script>
</body>

</html>
